<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1; 
            --primary-hover: #818cf8;
            --bg-base: #09090e;
            --panel-bg: rgba(26, 26, 46, 0.6); 
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(0, 0, 0, 0.4);
            --sheet-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background: radial-gradient(circle at 50% 0%, #1a1a3a 0%, #09090e 60%);
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column; 
            height: 100vh;
            overflow: hidden;
        }

        /* --- Scrollbars --- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* --- Header --- */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            z-index: 50;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-title span { color: var(--primary); }

        /* User Menu & API Dropdown */
        .user-menu-wrapper { position: relative; }
        
        .user-icon-btn {
            width:35px;    
            height:35px;   
            border-radius: 50%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            display: block; 
            cursor: pointer;
            transition: all 0.2s; position: relative;
        }

        .user-icon-btn:hover { 
            background: rgba(255,255,255,0.1); 
            border-color: var(--primary);  overflow: hidden;
        }

        .user-icon-btn svg { 
            width:30px;    
            height: 30px;    
            fill: currentColor;  position: absolute; left: 4px; top: 4px;
        }

        .api-dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            width: 280px;
            background: rgba(30, 30, 45, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
            transform-origin: top right;
            animation: fadeIn 0.2s ease;
        }
        .api-dropdown.show { display: flex; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .api-dropdown-title { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }

        /* --- App Container (Main Body) --- */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- Layout: Sidebars & Main Content --- */
        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 10;
            flex-shrink: 0;
        }

        .left-sidebar { border-right: 1px solid var(--border); box-shadow: 4px 0 24px rgba(0,0,0,0.4); }
        .right-sidebar { border-left: 1px solid var(--border); box-shadow: -4px 0 24px rgba(0,0,0,0.4); }

        .main-content {
            flex: 1;
            padding:20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center; min-height:400px;
        }

        h2 { font-size: 1.05rem; font-weight: 600; color: var(--text-main); padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 2px; display: flex; align-items: center; gap: 8px;}
        h2::before { content: ''; display: block; width: 6px; height: 16px; background: var(--primary); border-radius: 4px; }
        
        /* --- Controls --- */
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-group label { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); display: flex; justify-content: space-between; }
        .control-group label span { color: var(--primary); font-weight: 600; }

        input[type="file"], input[type="number"], input[type="text"], input[type="password"], select { 
            width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; 
            font-size: 0.9rem; background: var(--input-bg); color: var(--text-main); 
            cursor: pointer; transition: border-color 0.2s; outline: none;
        }
        input[type="text"], input[type="password"], input[type="number"] { cursor: text; font-size: 0.85rem; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        select option { background: #1a1a2e; color: #fff; }

        input[type="color"] { width: 100%; height: 40px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--input-bg); padding: 2px; }

        /* Range Sliders */
        input[type="range"] { -webkit-appearance: none; background: transparent; width: 100%; cursor: pointer; height: 20px; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--primary); margin-top: -5px; box-shadow: 0 0 10px rgba(99, 102, 241, 0.5); transition: transform 0.1s; }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        button { background-color: var(--primary); color: white; border: none; padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        button:hover { background-color: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        
        button.secondary { background-color: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--border); text-shadow: none; }
        button.secondary:hover { background-color: rgba(255,255,255,0.1); box-shadow: none; }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        #btnAutoFix { background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        #btnAutoFix:hover { background-color: rgba(245, 158, 11, 0.25); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2); }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        hr { border: 0; border-top: 1px solid var(--border); margin: 8px 0; }

        /* --- Editor Area --- */
        .cropper-area { 
            width: 100%; 
            min-height: 250px; 
            height: auto;
            background-color: #000; border-radius: 8px; 
            overflow: hidden; position: relative; border: 1px solid var(--border);
            transition: border 0.2s; box-shadow: inset 0 4px 20px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
        }
        #imageToCrop { max-width: 100%; display: block; }
        
        .preview-area { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 5px; border: 1px solid var(--border); padding: 15px; border-radius: 8px; background: rgba(0,0,0,0.2);}
        .preview-area label { font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase;}
        
        #resultPreviewCanvas { 
            max-width: 130px; 
            min-height: 160px; 
            height: auto;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            background: #fff;
            display: none; 
            border-radius: 4px;
        }

        /* --- A4 Sheet Preview --- */
        .a4-container { display: flex; flex-direction: column; gap: 40px; width: 100%; align-items: center; padding-bottom: 40px; }
        .a4-sheet { 
            width: 100%; max-width: 210mm; aspect-ratio: 210 / 297; background: var(--sheet-bg); padding: 2%; 
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 1%; align-content: start; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; 
            border-radius: 2px;
        }
        
        /* UPDATED: Clickable Photo Effect */
        .photo-wrapper { 
            position: relative; width: 100%; border: 1px solid #000; 
            overflow: hidden; background: #f9fafb; 
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .photo-wrapper:hover {
            transform: scale(0.96);
            box-shadow: 0 0 0 3px var(--primary);
            z-index: 10;
        }
        
        .photo-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

        #yellowSlider::-webkit-slider-runnable-track { background: linear-gradient(to right, #3b82f6, rgba(255,255,255,0.2), #eab308); }

        @media (max-width: 992px) {
            .app-container { flex-direction: column; height: auto; overflow-y: auto; }
            body { overflow-y: auto; }
            .sidebar { width: 100%; box-shadow: none; border: none; height: auto; overflow: visible; padding: 20px; backdrop-filter: none; background: #13131f; }
            .left-sidebar, .right-sidebar { border-bottom: 1px solid var(--border); }
            .main-content { padding: 20px; }
            .cropper-area { min-height: 200px; }
        }

        @media print {
            @page { size: A4; margin: 0; }
            body { background: white !important; display: block; overflow: visible; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .top-header, .sidebar { display: none !important; }
            .app-container { display: block; overflow: visible; }
            .main-content { padding: 0; overflow: visible; display: block; background: white;}
            .a4-container { gap: 0; display: block; padding-bottom: 0;}
            .a4-sheet { box-shadow: none; margin: 0; width: 210mm; height: 297mm; padding: 15px; page-break-after: always; border-radius: 0;}
            .photo-wrapper { border: 1px solid black !important; }
            .pro-tip { display: none !important; } /* Hide tip on print */
        }
    </style>
</head>

    <script>
        const userMenuBtn = document.getElementById('userMenuBtn');
        const apiDropdown = document.getElementById('apiDropdown');
        userMenuBtn.addEventListener('click', () => apiDropdown.classList.toggle('show'));
        document.addEventListener('click', (e) => {
            if (!userMenuBtn.contains(e.target) && !apiDropdown.contains(e.target)) apiDropdown.classList.remove('show');
        });

        const imageInput = document.getElementById('imageInput');
        const imageToCrop = document.getElementById('imageToCrop');
        const cropperArea = document.querySelector('.cropper-area');
        
        const sizeSelect = document.getElementById('sizeSelect');
        const customSizeArea = document.getElementById('customSizeArea');
        const customUnit = document.getElementById('customUnit');
        const customWidth = document.getElementById('customWidth');
        const customHeight = document.getElementById('customHeight');

        const resultPreviewCanvas = document.getElementById('resultPreviewCanvas');
        const pCtx = resultPreviewCanvas.getContext('2d');

        const apiSlotSelect = document.getElementById('apiSlotSelect');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const btnRemoveBg = document.getElementById('btnRemoveBg');
        const bgColorPicker = document.getElementById('bgColorPicker');
        const btnApplyColor = document.getElementById('btnApplyColor');
        const btnAddToA4 = document.getElementById('btnAddToA4');
        const btnClearEditor = document.getElementById('btnClearEditor');
        const btnClearSheets = document.getElementById('btnClearSheets');
        const btnPrint = document.getElementById('btnPrint');
        const btnDownloadJpg = document.getElementById('btnDownloadJpg');
        const btnDownloadPdf = document.getElementById('btnDownloadPdf');
        const btnResetFilters = document.getElementById('btnResetFilters');
        const btnAutoFix = document.getElementById('btnAutoFix');
        const quantityInput = document.getElementById('quantityInput');
        
        const gridFlowSelect = document.getElementById('gridFlowSelect'); 
        const rotateSheetPhotos = document.getElementById('rotateSheetPhotos');
        const btnRearrangeLayout = document.getElementById('btnRearrangeLayout'); 

        const a4Container = document.getElementById('a4Container');
        const filterCanvas = document.getElementById('filterCanvas');
        const fCtx = filterCanvas.getContext('2d');

        const btnRotateLeft = document.getElementById('btnRotateLeft');
        const btnRotateRight = document.getElementById('btnRotateRight');
        const straightenSlider = document.getElementById('straightenSlider');
        let currentBaseRotation = 0; 

        const brightnessInput = document.getElementById('brightness');
        const contrastInput = document.getElementById('contrast');
        const saturateInput = document.getElementById('saturate');
        const yellowSlider = document.getElementById('yellowSlider'); 
        const warmthInput = document.getElementById('warmth');

        let cropper = null;
        let originalCroppedCanvas = null; 

        let currentPhotoWidthCm = 3.5;
        let currentPhotoHeightCm = 4.5;
        let currentPhotoAspectRatio = 3.5 / 4.5;

        let savedApiKeys = JSON.parse(localStorage.getItem('removeBgApiKeys')) || ["", "", "", ""];
        apiKeyInput.value = savedApiKeys[0];

        apiSlotSelect.addEventListener('change', () => apiKeyInput.value = savedApiKeys[apiSlotSelect.value]);
        apiKeyInput.addEventListener('change', () => {
            savedApiKeys[apiSlotSelect.value] = apiKeyInput.value.trim();
            localStorage.setItem('removeBgApiKeys', JSON.stringify(savedApiKeys));
        });

        function updatePhotoDimensions() {
            const sizeVal = sizeSelect.value;
            if (sizeVal === 'custom') {
                customSizeArea.style.display = 'flex';
                let w = parseFloat(customWidth.value), h = parseFloat(customHeight.value), unit = customUnit.value;
                if (w > 0 && h > 0) {
                    if (unit === 'cm') { currentPhotoWidthCm = w; currentPhotoHeightCm = h; }
                    else if (unit === 'mm') { currentPhotoWidthCm = w / 10; currentPhotoHeightCm = h / 10; }
                    else if (unit === 'inch') { currentPhotoWidthCm = w * 2.54; currentPhotoHeightCm = h * 2.54; }
                    currentPhotoAspectRatio = w / h;
                }
            } else {
                customSizeArea.style.display = 'none';
                if (sizeVal === 'passport') { currentPhotoWidthCm = 3.5; currentPhotoHeightCm = 4.5; currentPhotoAspectRatio = 3.5 / 4.5; }
                else if (sizeVal === 'stamp') { currentPhotoWidthCm = 2.2; currentPhotoHeightCm = 2.5; currentPhotoAspectRatio = 2.2 / 2.5; }
                else if (sizeVal === '2x2') { currentPhotoWidthCm = 5.1; currentPhotoHeightCm = 5.1; currentPhotoAspectRatio = 1; }
            }
            if (cropper) { cropper.setAspectRatio(currentPhotoAspectRatio); requestLivePreview(); }
        }

        [sizeSelect, customUnit, customWidth, customHeight].forEach(i => i.addEventListener('change', updatePhotoDimensions));
        updatePhotoDimensions();

        function applyRotation() {
            if (cropper) {
                const fineRotation = parseInt(straightenSlider.value, 10);
                cropper.rotateTo(currentBaseRotation + fineRotation);
                requestLivePreview();
            }
        }

        btnRotateLeft.addEventListener('click', () => { if (cropper) { currentBaseRotation -= 90; applyRotation(); } });
        btnRotateRight.addEventListener('click', () => { if (cropper) { currentBaseRotation += 90; applyRotation(); } });
        straightenSlider.addEventListener('input', () => {
            document.getElementById('straightenVal').textContent = straightenSlider.value + '°';
            applyRotation();
        });

        function requestLivePreview() {
            if (!cropper) return;
            originalCroppedCanvas = cropper.getCroppedCanvas({ width: 350, height: 450 }); 
            applyFiltersToCanvas(originalCroppedCanvas, resultPreviewCanvas);
            resultPreviewCanvas.style.display = 'block';
        }

        function applyFiltersToCanvas(sourceCanvas, targetCanvas) {
            const ctx = targetCanvas.getContext('2d');
            targetCanvas.width = sourceCanvas.width;
            targetCanvas.height = sourceCanvas.height;
            ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);

            let fStr = `brightness(${brightnessInput.value}%) contrast(${contrastInput.value}%) saturate(${saturateInput.value}%)`;
            ctx.filter = fStr;
            ctx.drawImage(sourceCanvas, 0, 0);
            ctx.filter = 'none';

            applyYellowAdjustment(targetCanvas, ctx, parseInt(yellowSlider.value));

            let wVal = parseFloat(warmthInput.value);
            if (wVal !== 0) {
                ctx.globalCompositeOperation = 'overlay';
                ctx.fillStyle = wVal > 0 ? `rgba(255, 100, 0, ${wVal / 200})` : `rgba(0, 100, 255, ${Math.abs(wVal) / 200})`;
                ctx.fillRect(0, 0, targetCanvas.width, targetCanvas.height);
                ctx.globalCompositeOperation = 'source-over'; 
            }
        }

        function applyYellowAdjustment(canvas, ctx, adjustment) {
            if (adjustment === 0) return;
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const adj = adjustment / 100; 

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i + 1], b = data[i + 2];
                const minRG = Math.min(r, g);
                if (minRG > b) { 
                    const yellowSatur = minRG - b;
                    const factor = 1 + (adj * (yellowSatur / 255) * 2); 
                    data[i] = Math.min(255, Math.max(0, r * factor));   
                    data[i + 1] = Math.min(255, Math.max(0, g * factor)); 
                    if (adjustment > 0) data[i+2] = Math.max(0, b * (1 - adj*0.2)); 
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        let isRendering = false;
        const sliders = [brightnessInput, contrastInput, saturateInput, yellowSlider, warmthInput];
        sliders.forEach(input => {
            input.addEventListener('input', () => {
                let suffix = (input.id === 'yellowSlider' || input.id === 'warmth') ? '' : '%';
                document.getElementById(input.id + 'Val').textContent = input.value + suffix;
                
                if (input.id === 'warmth') {
                    if (input.value == 0) document.getElementById('warmthVal').textContent = 'Neutral';
                    else document.getElementById('warmthVal').textContent = (input.value > 0 ? 'Warm' : 'Cool');
                }
                
                if (!isRendering) {
                    isRendering = true;
                    requestAnimationFrame(() => {
                        requestLivePreview();
                        isRendering = false;
                    });
                }
            });
        });

        btnResetFilters.addEventListener('click', () => {
            brightnessInput.value = 100; contrastInput.value = 100; saturateInput.value = 100; yellowSlider.value = 0; warmthInput.value = 0;
            sliders.forEach(s => s.dispatchEvent(new Event('input')));
        });

        btnAutoFix.addEventListener('click', () => {
            brightnessInput.value = 105; contrastInput.value = 110; saturateInput.value = 105; yellowSlider.value = -5; warmthInput.value = 0;
            sliders.forEach(s => s.dispatchEvent(new Event('input')));
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                imageToCrop.src = event.target.result;
                currentBaseRotation = 0;
                straightenSlider.value = 0;
                document.getElementById('straightenVal').textContent = '0°';

                if (cropper) cropper.replace(imageToCrop.src);
                else initCropper();
            };
            reader.readAsDataURL(file);
        });

        function initCropper() {
            cropper = new Cropper(imageToCrop, {
                aspectRatio: currentPhotoAspectRatio, viewMode: 1, autoCropArea: 1,
                cropend: requestLivePreview, ready: requestLivePreview
            });
        }
        
        cropperArea.addEventListener('dragover', (e) => { e.preventDefault(); cropperArea.style.borderColor = 'var(--primary)'; });
        cropperArea.addEventListener('dragleave', () => { cropperArea.style.borderColor = 'var(--border)'; });
        cropperArea.addEventListener('drop', (e) => {
            e.preventDefault();
            cropperArea.style.borderColor = 'var(--border)';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                imageInput.files = dataTransfer.files;
                imageInput.dispatchEvent(new Event('change'));
            }
        });

        btnRemoveBg.addEventListener('click', async () => {
            if (!cropper) return alert('Upload image first.');
            const validKeys = savedApiKeys.filter(key => key.length > 5);
            if (validKeys.length === 0) {
                apiDropdown.classList.add('show');
                return alert('Please enter at least one valid API Key in the user settings (Top Right corner).');
            }

            btnRemoveBg.textContent = "Processing..."; 
            btnRemoveBg.disabled = true;

            cropper.getCroppedCanvas().toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('size', 'auto'); 
                formData.append('image_file', blob);
                
                let success = false;
                for (let i = 0; i < validKeys.length; i++) {
                    try {
                        const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                            method: 'POST', 
                            headers: { 'X-Api-Key': validKeys[i] }, 
                            body: formData
                        });

                        if (response.ok) {
                            const resultUrl = URL.createObjectURL(await response.blob());
                            cropper.replace(resultUrl);
                            success = true;
                            break; 
                        }
                    } catch (error) { console.error('API Error:', error); }
                }
                if (!success) alert('Background removal failed. API limits exhausted or keys invalid.');
                btnRemoveBg.textContent = "✂️ Auto-Remove BG"; 
                btnRemoveBg.disabled = false; 
            });
        });

        btnApplyColor.addEventListener('click', () => {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas();
            filterCanvas.width = canvas.width; filterCanvas.height = canvas.height;
            fCtx.fillStyle = bgColorPicker.value; fCtx.fillRect(0, 0, filterCanvas.width, filterCanvas.height);
            fCtx.drawImage(canvas, 0, 0);
            cropper.replace(filterCanvas.toDataURL());
        });

        btnAddToA4.addEventListener('click', () => {
            if (!cropper) return alert('Upload an image first.');
            const quantity = parseInt(quantityInput.value, 10);
            if (quantity < 1) return;

            const rawOutputCanvas = cropper.getCroppedCanvas({ imageSmoothingQuality: 'high' });
            applyFiltersToCanvas(rawOutputCanvas, filterCanvas);
            const finalDataUrl = filterCanvas.toDataURL('image/jpeg', 0.95);

            let cols = 6;
            let maxPerSheet = 36;
            
            if (currentPhotoWidthCm >= 10 && currentPhotoHeightCm >= 15) { cols = 2; maxPerSheet = 4; } 
            else if (currentPhotoWidthCm >= 5) { cols = 4; maxPerSheet = 16; } 
            else if (currentPhotoWidthCm <= 2.5) { cols = 8; maxPerSheet = 64; }

            let itemsCreated = 0;
            while (itemsCreated < quantity) {
                let sheets = document.querySelectorAll('.a4-sheet');
                let sheet = sheets[sheets.length - 1];
                
                if (!sheet || sheet.children.length >= maxPerSheet) { 
                    sheet = document.createElement('div');
                    sheet.className = 'a4-sheet';
                    
                    sheet.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
                    if (gridFlowSelect.value === 'column') {
                        sheet.style.gridAutoFlow = 'column';
                        let rows = Math.ceil(maxPerSheet / cols);
                        sheet.style.gridTemplateRows = `repeat(${rows}, min-content)`;
                    } else {
                        sheet.style.gridAutoFlow = 'row';
                        sheet.style.gridTemplateRows = 'none';
                    }
                    a4Container.appendChild(sheet);
                }
                
                let availableSlots = maxPerSheet - sheet.children.length;
                let toAdd = Math.min(quantity - itemsCreated, availableSlots);
                const fragment = document.createDocumentFragment();
                
                for (let i = 0; i < toAdd; i++) {
                    const photoWrapper = document.createElement('div');
                    photoWrapper.className = 'photo-wrapper';
                    photoWrapper.style.aspectRatio = `${currentPhotoWidthCm} / ${currentPhotoHeightCm}`;
                    
                    photoWrapper.dataset.origW = currentPhotoWidthCm;
                    photoWrapper.dataset.origH = currentPhotoHeightCm;
                    photoWrapper.dataset.rotated = "false"; // Track rotation state

                    const imgNode = document.createElement('img');
                    imgNode.src = finalDataUrl;
                    imgNode.dataset.originalSrc = finalDataUrl; 
                    
                    photoWrapper.appendChild(imgNode);
                    fragment.appendChild(photoWrapper);
                    itemsCreated++;
                }
                sheet.appendChild(fragment);
            }
            if (window.innerWidth <= 992) a4Container.scrollIntoView({ behavior: 'smooth' });
        });

        btnClearEditor.addEventListener('click', () => {
            if (cropper) { cropper.destroy(); cropper = null; }
            imageToCrop.src = ''; resultPreviewCanvas.style.display = 'none'; imageInput.value = '';
            currentBaseRotation = 0; straightenSlider.value = 0; document.getElementById('straightenVal').textContent = '0°';
            btnResetFilters.click();
        });

        btnClearSheets.addEventListener('click', () => {
            if(confirm('Delete all photos from sheets?')) { a4Container.innerHTML = '<div class="a4-sheet"></div>'; }
        });

        btnPrint.addEventListener('click', () => window.print());

        btnDownloadJpg.addEventListener('click', () => {
            const sheets = document.querySelectorAll('.a4-sheet');
            if (sheets.length === 0 || sheets[0].children.length === 0) return alert('Sheets are empty.');
            
            btnDownloadJpg.innerHTML = "⏳ Wait...";
            btnDownloadJpg.disabled = true;
            setTimeout(async () => {
                for (let i = 0; i < sheets.length; i++) {
                    const canvas = await html2canvas(sheets[i], { scale: 3, useCORS: true });
                    const link = document.createElement('a');
                    link.download = `Passport_Sheet_${i + 1}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 1.0); 
                    link.click();
                }
                btnDownloadJpg.innerHTML = "🖼️ JPG"; btnDownloadJpg.disabled = false;
            }, 50);
        });

        btnDownloadPdf.addEventListener('click', () => {
            const sheets = document.querySelectorAll('.a4-sheet');
            if (sheets.length === 0 || sheets[0].children.length === 0) return alert('Sheets are empty.');
            
            btnDownloadPdf.innerHTML = "⏳ Wait...";
            btnDownloadPdf.disabled = true;
            setTimeout(() => {
                html2pdf().set({
                    margin: 0, filename: 'Passport_Sheets.pdf', image: { type: 'jpeg', quality: 1.0 },
                    html2canvas: { scale: 3, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                }).from(a4Container).save().then(() => {
                    btnDownloadPdf.innerHTML = "📄 PDF"; btnDownloadPdf.disabled = false;
                });
            }, 50);
        });

        // --- NAYA FUNCTION: Image ko High Quality me 90° Rotate Karne ke liye ---
        function rotateImage90(src, callback) {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.height; 
                canvas.height = img.width; 
                const ctx = canvas.getContext('2d');
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(90 * Math.PI / 180);
                ctx.drawImage(img, -img.width / 2, -img.height / 2);
                callback(canvas.toDataURL('image/jpeg', 1.0));
            };
            img.src = src;
        }

        // --- LOGIC: Bulk Re-arrange and Rotate via Sidebar Button ---
        btnRearrangeLayout.addEventListener('click', () => {
            const sheets = document.querySelectorAll('.a4-sheet');
            if (sheets.length === 0 || sheets[0].children.length === 0) {
                return alert('Sheet par koi photo nahi hai. Pehle photos add karein.');
            }

            btnRearrangeLayout.innerHTML = "⏳ Updating...";
            btnRearrangeLayout.disabled = true;

            const selectedFlow = gridFlowSelect.value;
            const isRotated = rotateSheetPhotos.checked;

            const updateGridStyles = () => {
                sheets.forEach(sheet => {
                    let cols = 6; 
                    let maxPerSheet = 36;
                    
                    if (currentPhotoWidthCm >= 10 && currentPhotoHeightCm >= 15) { cols = 2; maxPerSheet = 4; } 
                    else if (currentPhotoWidthCm >= 5) { cols = 4; maxPerSheet = 16; } 
                    else if (currentPhotoWidthCm <= 2.5) { cols = 8; maxPerSheet = 64; }

                    sheet.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
                    
                    if (selectedFlow === 'column') {
                        sheet.style.gridAutoFlow = 'column';
                        let rows = Math.ceil(maxPerSheet / cols);
                        sheet.style.gridTemplateRows = `repeat(${rows}, min-content)`; 
                    } else {
                        sheet.style.gridAutoFlow = 'row';
                        sheet.style.gridTemplateRows = 'none';
                    }
                });

                btnRearrangeLayout.innerHTML = "✅ Layout Updated!";
                btnRearrangeLayout.style.borderColor = "#10B981";
                btnRearrangeLayout.disabled = false;
                setTimeout(() => {
                    btnRearrangeLayout.innerHTML = "🔄 Update Existing Sheet Layout";
                    btnRearrangeLayout.style.borderColor = "var(--border)";
                }, 1500);
            };

            const imagesToUpdate = document.querySelectorAll('.photo-wrapper img');
            let processed = 0;

            if (imagesToUpdate.length === 0) { updateGridStyles(); return; }

            imagesToUpdate.forEach(img => {
                const wrapper = img.parentElement;
                const w = wrapper.dataset.origW || currentPhotoWidthCm;
                const h = wrapper.dataset.origH || currentPhotoHeightCm;
                
                if (!img.dataset.originalSrc) {
                    processed++;
                    if(processed === imagesToUpdate.length) updateGridStyles();
                    return;
                }

                if (isRotated) {
                    wrapper.dataset.rotated = "true";
                    wrapper.style.aspectRatio = `${h} / ${w}`; 
                    rotateImage90(img.dataset.originalSrc, (newSrc) => {
                        img.src = newSrc;
                        processed++;
                        if(processed === imagesToUpdate.length) updateGridStyles();
                    });
                } else {
                    wrapper.dataset.rotated = "false";
                    wrapper.style.aspectRatio = `${w} / ${h}`; 
                    img.src = img.dataset.originalSrc;
                    processed++;
                    if(processed === imagesToUpdate.length) updateGridStyles();
                }
            });
        });

        // --- NAYA LOGIC: Click On Any Photo to Rotate Entire Row ---
        a4Container.addEventListener('click', (e) => {
            const clickedWrapper = e.target.closest('.photo-wrapper');
            if (!clickedWrapper) return;

            const sheet = clickedWrapper.parentElement;
            const clickedRect = clickedWrapper.getBoundingClientRect();
            
            // Find all photos in the exact same visual horizontal row
            const tolerance = 5; 
            const rowItems = Array.from(sheet.querySelectorAll('.photo-wrapper')).filter(item => {
                const itemRect = item.getBoundingClientRect();
                return Math.abs(itemRect.top - clickedRect.top) <= tolerance;
            });

            // Toggle state: Agar pehle se rotated hai toh normal karo, warna rotate karo
            const isCurrentlyRotated = clickedWrapper.dataset.rotated === 'true';
            const targetState = !isCurrentlyRotated;

            rowItems.forEach(item => {
                item.dataset.rotated = targetState; 
                
                const w = item.dataset.origW || currentPhotoWidthCm;
                const h = item.dataset.origH || currentPhotoHeightCm;
                const img = item.querySelector('img');

                if (targetState) {
                    // Rotate kar rahe hain
                    item.style.aspectRatio = `${h} / ${w}`; 
                    rotateImage90(img.dataset.originalSrc, (newSrc) => {
                        img.src = newSrc;
                    });
                } else {
                    // Wapas Normal kar rahe hain
                    item.style.aspectRatio = `${w} / ${h}`; 
                    img.src = img.dataset.originalSrc; 
                }
            });
        });
    </script>
